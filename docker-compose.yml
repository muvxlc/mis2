services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.4
    container_name: mis-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mis_db}
      MYSQL_USER: ${MYSQL_USER:-mis_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mis-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mis-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mis-network

  # Apply the current schema and seed required default records before the app starts
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: database-init
    container_name: mis-db-init
    restart: "no"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-mis_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mariadb:3306/${MYSQL_DATABASE:-mis_db}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - mis-network

  # Nuxt App (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mis-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database
      DATABASE_URL: mysql://${MYSQL_USER:-mis_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mariadb:3306/${MYSQL_DATABASE:-mis_db}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # ThaiID OAuth
      THAID_CLIENT_ID: ${THAID_CLIENT_ID}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET}
      THAID_REDIRECT_URI: ${THAID_CALLBACK_URL:-${THAID_REDIRECT_URI:-http://localhost:3000/api/auth/thaid/callback}}
      THAID_SCOPE: ${THAID_SCOPE:-openid pid name}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - public_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mis-network

  # Nuxt App (Development with Hot Reload)
  dev:
    image: node:22-alpine
    container_name: mis-app-dev
    profiles:
      - development
    working_dir: /app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true" # Important for Docker on Windows/Mac
      # Database
      DATABASE_URL: mysql://${MYSQL_USER:-mis_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mariadb:3306/${MYSQL_DATABASE:-mis_db}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # ThaiID OAuth
      THAID_CLIENT_ID: ${THAID_CLIENT_ID}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET}
      THAID_REDIRECT_URI: ${THAID_CALLBACK_URL:-${THAID_REDIRECT_URI:-http://localhost:3000/api/auth/thaid/callback}}
      THAID_SCOPE: ${THAID_SCOPE:-openid pid name}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    command: sh -c "npm install && npm run dev"
    networks:
      - mis-network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  public_uploads:
    driver: local

networks:
  mis-network:
    driver: bridge
