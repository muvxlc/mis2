version: '3.9'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.4
    container_name: mis-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mis_db}
      MYSQL_USER: ${MYSQL_USER:-mis_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mis_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mis-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mis-network

  # Nuxt App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mis-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database
      DATABASE_URL: mysql://${MYSQL_USER:-mis_user}:${MYSQL_PASSWORD:-mis_password}@mariadb:3306/${MYSQL_DATABASE:-mis_db}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      # ThaiID OAuth
      THAID_CLIENT_ID: ${THAID_CLIENT_ID}
      THAID_CLIENT_SECRET: ${THAID_CLIENT_SECRET}
      THAID_REDIRECT_URI: ${THAID_REDIRECT_URI:-http://localhost:3000/api/auth/thaid/callback}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - public_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mis-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: mis-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    networks:
      - mis-network
    profiles:
      - with-nginx

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  public_uploads:
    driver: local

networks:
  mis-network:
    driver: bridge
